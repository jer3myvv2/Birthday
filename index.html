<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <div id="screen1" class="screen active">
        <h3>Enter a passcode</h3>
        <p id="pass-display">_ _ _ _</p>
        <div class="passcode-grid">
            <button onclick="addNum(1)">1</button>
            <button onclick="addNum(2)">2</button>
            <button onclick="addNum(3)">3</button>
            <button onclick="addNum(4)">4</button>
            <button onclick="addNum(5)">5</button>
            <button onclick="addNum(6)">6</button>
            <button onclick="addNum(7)">7</button>
            <button onclick="addNum(8)">8</button>
            <button onclick="addNum(9)">9</button>
        </div>
    </div>

    <div id="screen2" class="screen">
        <h2>HAPPY BIRTHDAY!</h2>
        <img src="birthday-photo.jpg" class="photo-frame" alt="Us">
        <p>I made this just for you.</p>
        <button class="btn-action" onclick="nextScreen(3)">NEXT</button>
    </div>

    <div id="screen3" class="screen">
        <h2>Are you ready for a surprise?</h2>
        <div class="choice-buttons">
            <button class="btn-action" onclick="nextScreen(4)">YES</button>
            <button class="btn-action btn-no" onclick="handleNo()">NO</button>
        </div>
    </div>

    <div id="screen4" class="screen">
        <h2>Pick a gift!</h2>
        <div class="gift-container">
            <div class="gift" onclick="alert('Reward: A romantic dinner!')">🎁</div>
            <div class="gift" onclick="alert('Reward: A shopping spree!')">🎁</div>
            <div class="gift" onclick="alert('Reward: 1000 Hugs!')">🎁</div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
